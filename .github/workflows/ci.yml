name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # dist/ is committed to the repository; fail if it was not rebuilt
      # after a change to src/.
      - name: Check dist is in sync with src
        run: git diff --exit-code dist/
      - run: npm test
      # educational guide snippets must match the source they quote
      - run: node tools/snippets.js --check
